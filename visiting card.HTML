<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visiting Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #dfdee7;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 400px;
            height: 220px;
            background: rgba(7, 1, 47, 0.037);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(11, 1, 41, 0.2);
        }

        .name {
            font-size: 28px;
            font-weight: bold;
            color: #222;
            margin-bottom: 5px;
        }

        .job {
            color: #040235;
            font-size: 16px;
            margin-bottom: 20px;
        }

        .info {
            font-size: 14px;
            color: #120449;
            line-height: 1.8;
        }

        .info strong {
            color: #1a033f;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="name">VISHAL GURNULE</div>

        <div class="job">
            Web Develope
        </div>

        <div class="info">
            <strong>📞 Phone:</strong> +91 7276595352<br>
            <strong>✉️ Email:</strong>gurnulev000@gmail.com<br>
            <strong>🌐 Website:</strong> www.example.com<br>
            <strong>📍 Address:</strong> Nagpur, Maharashtra
        </div>

    </div>

</body>
</html>
